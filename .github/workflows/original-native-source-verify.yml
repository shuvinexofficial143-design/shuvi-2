name: Shuvi 2 Original Native Editor Compilation (source only)
on:
  push:
    branches:
      - feature/shuvi2-release-integration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shuvi-original-native-verify-motion-text-v13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-editor-cargo-check:
    name: ${{ matrix.editor }} original egui native source
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: FilmCraft
            manifest: original-editors/Shuvi2-Video/Cargo.toml
            package: filmcraft-ui-egui
          - editor: EffectCraft
            manifest: original-editors/Shuvi2-Motion/Cargo.toml
            package: effectcraft-ui-egui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - name: Check immutable ORIGINAL native source identity
        shell: pwsh
        run: |
          node scripts/release/assert-original-source-tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Original source is NOT exact pinned tree' }
      - name: Apply reviewed release-only native compatibility overlay
        shell: pwsh
        run: |
          if ('${{ matrix.editor }}' -eq 'EffectCraft') {
            node scripts/release/apply-reviewed-native-overlays.mjs motion
            if ($LASTEXITCODE -ne 0) { throw 'Motion native compatibility overlay rejected' }
          }
      - name: Verify real original egui Rust UI compilation (NOT installed GUI E2E)
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo check --manifest-path ${{ matrix.manifest }} -p ${{ matrix.package }} --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Real original editor native UI cargo check FAILED' }

  original-filmcraft-a07-owner-native-split:
    name: Original FilmCraft native GUI + canonical A07 owner-split tests
    runs-on: windows-2022
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - name: Pin all original source IDs before test overlay
        shell: pwsh
        run: |
          node scripts/release/assert-original-source-tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Original source identity changed' }
      - name: Apply minimal Video A07 Rust test ownership repair
        shell: pwsh
        run: |
          node scripts/release/apply-reviewed-native-overlays.mjs videoA07
          if ($LASTEXITCODE -ne 0) { throw 'Original Video owner bridge overlay rejected' }
      - name: Test ORIGINAL FilmCraft GUI owner and real native split against imported canonical AI A08
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --manifest-path original-editors/Shuvi2-Video/a07-native-bridge/Cargo.toml --test shared_owner_admission -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Original FilmCraft native owner+AI split test FAILED (not live Windows human UI)' }

  original-effectcraft-native-text-owner:
    name: Original EffectCraft native text mutation and manual-owner exclusion
    runs-on: windows-2022
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - name: Verify original EffectCraft owner source is EXACT upstream Git tree
        shell: pwsh
        run: |
          node scripts/release/assert-original-source-tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original EffectCraft source identity mismatch' }
      - name: Apply reviewed source-only EffectCraft owner-gate result type repair
        shell: pwsh
        run: |
          node scripts/release/apply-reviewed-native-overlays.mjs motion
          if ($LASTEXITCODE -ne 0) { throw 'EffectCraft native owner compatibility overlay rejected' }
      - name: REAL original EffectCraft in-process text edit, object readback and no-duplicate native revision tests
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --manifest-path original-editors/Shuvi2-Motion/Cargo.toml -p effectcraft-ui-egui shuvi_motion_owner::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Original EffectCraft native text edit/readback or stale/duplicate guard FAILED' }
      - name: REAL original EffectCraft shared manual/native owner exclusion tests
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --manifest-path original-editors/Shuvi2-Motion/Cargo.toml -p effectcraft-ui-egui shuvi_owner_gate::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Original EffectCraft manual owner lock, nested reentry or restore guard FAILED' }
