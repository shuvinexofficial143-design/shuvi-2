name: Shuvi 2 AI Director A05 verification
on:
  push:
    branches:
      - feature/shuvi2-ai-director
  pull_request:
    paths:
      - 'src/ai-director/**'
      - 'tests/ai-director-*.test.mjs'
      - 'docs/ai-director/**'
      - '.github/workflows/ai-director.yml'
concurrency:
  group: ai-director-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ai-director-contracts-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded AI action plans and consent on exact branch HEAD
        run: node --test tests/ai-director-core.test.mjs tests/ai-director-a02.test.mjs tests/ai-director-a04.test.mjs tests/ai-director-a05.test.mjs
      - name: Verify existing app regressions
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

  native-model-provider-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile real HTTPS provider and test no-network request safeguards
        run: cargo test --manifest-path src-tauri/src/ai_director/Cargo.toml
