name: Shuvi 2 Video - AI15 Full Eframe Lifecycle Native Admission
on:
  push:
    branches:
      - feature/shuvi2-original-video-ai
    paths:
      - 'original-editors/Shuvi2-Video/**'
      - '.github/workflows/shuvi2-video-ai01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuvi2-video-ai15
  cancel-in-progress: false

jobs:
  verify-and-build-native-video:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout OWN Shuvi2 Video source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: original-editors/Shuvi2-Video
          key: filmcraft-shuvi-ai01
      - name: Verify preserved Original Editor, origin and notices
        shell: pwsh
        run: |
          foreach ($f in @(
            "original-editors/Shuvi2-Video/apps/filmcraft/src/main.rs",
            "original-editors/Shuvi2-Video/crates/ui-egui/src/lib.rs",
            "original-editors/Shuvi2-Video/crates/engine/src/shuvi_ai_readonly.rs",
            "original-editors/Shuvi2-Video/crates/engine/src/shuvi_ai_owner.rs",
            "original-editors/Shuvi2-Video/crates/ui-egui/src/panels/shuvi_ai.rs",
            "original-editors/Shuvi2-Video/NOTICE",
            "original-editors/Shuvi2-Video/SHUVI_SOURCE_ORIGIN.txt"
          )) { if (!(Test-Path $f)) { throw "Source/attribution missing: $f" } }
      - name: Real Session registry, readback, edit, undo and disk roundtrip tests
        shell: pwsh
        run: cargo test --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft-engine --test shuvi_native_contract -- --nocapture
      - name: Real typed native split, stale fence, cross-session isolation and readback tests
        shell: pwsh
        run: cargo test --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft-engine --lib shuvi_ai_owner -- --nocapture
      - name: Verify real native Shuvi AI egui panel dock and UI safety tests
        shell: pwsh
        run: cargo test --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft-ui-egui shuvi_ai -- --nocapture
      - name: Test native FilmcraftApp command admission and busy protection
        shell: pwsh
        run: cargo test --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft-ui-egui shuvi_manual_admission -- --nocapture
      - name: Verify original eframe lifecycle native owner and controlled shutdown
        shell: pwsh
        run: cargo test --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft-ui-egui lifecycle_owner -- --nocapture
      - name: Check Original FilmCraft GUI is still compilable
        shell: pwsh
        run: cargo check --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft
      - name: Build own Windows executable from this commit
        shell: pwsh
        run: cargo build --release --locked --manifest-path original-editors/Shuvi2-Video/Cargo.toml --package filmcraft
      - name: Package actual native executable and original notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "own-video" | Out-Null
          $src = "original-editors/Shuvi2-Video/target/release/filmcraft.exe"
          if (!(Test-Path $src)) { throw "Native Windows executable missing" }
          Copy-Item $src own-video/Shuvi2-Video.exe
          foreach ($f in @("LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "ATTRIBUTION.md", "SHUVI_SOURCE_ORIGIN.txt")) {
            Copy-Item "original-editors/Shuvi2-Video/$f" own-video
          }
          Get-FileHash own-video/Shuvi2-Video.exe -Algorithm SHA256 | Format-List
          Compress-Archive -Path own-video/* -DestinationPath "Shuvi2-Video-AI01-NativeBaseline-Win64.zip" -Force
          if ((Get-Item "Shuvi2-Video-AI01-NativeBaseline-Win64.zip").Length -lt 5000000) {
            throw "Native Windows ZIP unexpectedly small"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Shuvi2-Video-AI01-NativeBaseline-Windows-x64
          path: Shuvi2-Video-AI01-NativeBaseline-Win64.zip
          retention-days: 14
          if-no-files-found: error

  verify-canonical-a07-provider-source:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout ORIGINAL Video source for native guarded bridge tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Checkout pinned, separate canonical A07 AI Director commit (read only)
        uses: actions/checkout@v4
        with:
          ref: 64bf23e4cb9b4c95ca88b2f07ce9d57f7c2fa3e4
          path: a07-canonical
          persist-credentials: false
          submodules: false
      - name: Check canonical A07 vault, HTTPS provider, guarded host and SQLite receipts exist
        shell: pwsh
        run: |
          foreach ($f in @(
            "a07-canonical/src-tauri/src/ai_director/src/lib.rs",
            "a07-canonical/src-tauri/src/ai_director/src/windows_vault.rs",
            "a07-canonical/src-tauri/src/ai_director/src/host.rs",
            "a07-canonical/src-tauri/src/ai_director/src/transactional.rs"
          )) { if (!(Test-Path $f)) { throw "Canonical A07 source missing: $f" } }
          if (!(Select-String -Path a07-canonical/src-tauri/src/ai_director/src/windows_vault.rs -SimpleMatch "Shuvi2/OpenAI")) { throw "Vault target contract drift" }
          if (!(Select-String -Path a07-canonical/src-tauri/src/ai_director/src/lib.rs -SimpleMatch "https://api.openai.com/v1/chat/completions")) { throw "Canonical HTTPS provider contract drift" }
          if (!(Select-String -Path a07-canonical/src-tauri/src/ai_director/src/host.rs -SimpleMatch "unintegrated_capabilities")) { throw "A07 fail-closed capability contract absent" }
      - name: Test canonical provider, vault and SQLite native ledger as separate source crate
        shell: pwsh
        run: cargo test --manifest-path a07-canonical/src-tauri/src/ai_director/Cargo.toml -- --nocapture
      - name: Test exact canonical A07 SQLite GuardedHost against ORIGINAL FilmCraft native Session
        shell: pwsh
        run: cargo test --manifest-path original-editors/Shuvi2-Video/a07-native-bridge/Cargo.toml -- --nocapture
