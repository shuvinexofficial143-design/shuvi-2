name: Shuvi 2 foundation verify
on:
  push:
    branches: [main]
  pull_request:

# Only the newest PR commit needs a full foundation verdict.
# Previous check runs remain in GitHub history but no longer monopolize runners.
concurrency:
  group: shuvi2-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
