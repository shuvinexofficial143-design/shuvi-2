name: Shuvi 2 Integrated Windows Release Candidate
on:
  push:
    branches:
      - feature/shuvi2-release-integration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shuvi2-release-integration
  cancel-in-progress: true
jobs:
  integrated-windows-native-and-e2e:
    runs-on: windows-latest
    timeout-minutes: 115
    steps:
      - name: Checkout both real pinned engines
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/shuvi-motion-bridge
            vendor/filmcraft
      - name: Integration regression, native UI contracts, TypeScript build
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm dependencies failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Integrated UI contract tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Build actual FilmCraft Windows native sidecar
        shell: pwsh
        run: ./scripts/video/build-engine.ps1
      - name: Test real in-process EffectCraft compositor
        shell: pwsh
        run: |
          cargo test --manifest-path crates/shuvi-motion-bridge/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Motion engine tests failed' }
      - name: Verify one integrated Tauri Rust application
        shell: pwsh
        run: |
          $env:SHUVI_FILMCRAFT_CLI_PATH = (Resolve-Path src-tauri/binaries/filmcraft-cli-x86_64-pc-windows-msvc.exe).Path
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw 'Integrated Tauri tests failed' }
      - name: Build real unsigned NSIS installer with BOTH native studios
        shell: pwsh
        run: |
          npm run tauri -- build --config src-tauri/tauri.video.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Integrated Windows package failed' }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($files.Count -ne 1 -or $files[0].Length -lt 100000) { throw 'NSIS installer missing or too small' }
          Write-Host "Unsigned integrated installer: $($files[0].Name), bytes=$($files[0].Length)"
      - name: Launch actual native Shuvi Windows executable
        shell: pwsh
        timeout-minutes: 4
        run: ./scripts/video/desktop-launch-smoke.ps1
      - name: Try real Windows Video WebView2 FilmCraft E2E
        shell: pwsh
        timeout-minutes: 15
        run: node scripts/video/windows-desktop-e2e.mjs
      - name: Try real Windows Motion WebView2 EffectCraft E2E
        shell: pwsh
        timeout-minutes: 18
        run: ./scripts/motion/run-windows-e2e.ps1
      - name: Upload integrated unsigned Windows installer ONLY after all checks succeed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shuvi2-integrated-windows-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Preserve real Windows E2E screenshots, receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shuvi2-integration-e2e-evidence
          path: |
            src-tauri/target/video-desktop-launch-smoke.json
            src-tauri/target/video-desktop-e2e.json
            src-tauri/target/video-desktop-e2e.png
            proof/motion-desktop/
          if-no-files-found: warn
          retention-days: 7
