[package]
name = "shuvi2"
version = "0.1.0"
description = "Shuvi 2 unified AI creative desktop studio"
edition = "2021"
build = "build.rs"

[lib]
name = "shuvi2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
