[package]
name = "shuvi2"
version = "0.1.0"
description = "Shuvi 2 unified AI creative desktop studio"
edition = "2021"
build = "build.rs"

[lib]
name = "shuvi2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Video Studio only: stable project content fingerprint for stale-AI-edit protection.
sha2 = "0.10"
# V08: native dialogs; users choose files themselves instead of trusting guessed paths.
tauri-plugin-dialog = "2"

# Fixed HTTPS OpenAI endpoint for typed proposal generation; Rust owns the API request.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
