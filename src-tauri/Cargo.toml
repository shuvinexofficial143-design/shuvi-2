[package]
name = "shuvi2"
version = "0.1.0"
description = "Shuvi 2 unified AI creative desktop studio"
edition = "2021"
build = "build.rs"

[lib]
name = "shuvi2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Video Studio only: stable project content fingerprint for stale-AI-edit protection.
sha2 = "0.10"
# V08: native dialogs; users choose files themselves instead of trusting guessed paths.
tauri-plugin-dialog = "2"

# In-process EffectCraft with upstream-reviewed parser pins
shuvi-motion-bridge = { path = "../crates/shuvi-motion-bridge" }
base64 = "0.22"

[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", version = "=0.3.0" }
